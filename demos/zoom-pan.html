<!doctype html>
<!--
    Shows the canvas's zoom and pan. Run `npm run build` first, then open this
    page through a local server (e.g. `npx serve .` and go to
    /demos/zoom-pan.html). Browsers block module imports on file:// pages.

    Pinch or Ctrl+wheel to zoom, and scroll or drag empty space to pan. The
    status line at the top left shows the zoom, panX and panY.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zoom and pan</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: white;
        }
        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            font: 14px sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <div id="status"></div>
    <script type="module">
        import { Canvas, McText } from "../dist/index.js";

        const canvas = new Canvas(document.querySelector("canvas"));
        canvas.add(new McText({ text: "A text node wrapped to 100px.", x: 40, y: 80, width: 100, background: "yellow", resizable: true }));

        const status = document.querySelector("#status");
        // Runs on every render, so after every zoom and pan.
        canvas.drawOverlay = () => {
            status.textContent = `zoom ${canvas.zoom.toFixed(2)}, panX ${Math.round(canvas.panX)}, panY ${Math.round(canvas.panY)}`;
        };

        canvas.render();
    </script>
</body>
</html>
