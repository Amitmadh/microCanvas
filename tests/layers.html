<!doctype html>
<!--
    Visual test for node layers. Run `npm run build` first, then open this
    page through a local server (e.g. `npx serve .` and go to
    /tests/layers.html). Browsers block module imports on file:// pages.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layers test</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: white;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script type="module">
        import { Canvas, Rectangle, Text } from "../dist/index.js";

        const canvas = new Canvas(document.querySelector("canvas"), { grid: true });

        // Three overlapping squares, offset so each one shows which is on top.
        function stack(x, y, layers) {
            const colors = ["tomato", "gold", "royalblue"];
            return layers.map((layer, i) => new Rectangle({
                x: x + i * 40, y: y + i * 40, width: 100, height: 100,
                fill: colors[i], stroke: "black", strokeWidth: 2, layer,
            }));
        }

        const cases = [
            ["Same layer: added order (blue on top)", 40, 60, [0, 0, 0]],
            ["Reversed layers (red on top)", 340, 60, [2, 1, 0]],
            ["Negative layer (red under all)", 640, 60, [-1, 0, 0]],
            ["Middle raised (yellow on top)", 40, 340, [0, 5, 0]],
        ];

        for (const [text, x, y, layers] of cases) {
            canvas.add(new Text({ text, x, y: y - 12 }), ...stack(x, y, layers));
        }

        // Changing a layer after adding takes effect on the next render.
        const changed = stack(340, 340, [0, 0, 0]);
        canvas.add(new Text({ text: "Changed after add (red on top)", x: 340, y: 328 }), ...changed);
        changed[0].layer = 1;

        // The canvas caches its sorted nodes, so a layer changed after a render
        // has to show up in the next one. Yellow joins red's layer and was
        // added after red, so it goes on top.
        const changedLater = stack(640, 340, [1, 0, 0]);
        canvas.add(new Text({ text: "Changed after render (yellow on top)", x: 640, y: 328 }), ...changedLater);
        canvas.render();
        changedLater[1].layer = 1;

        // The canvas also redraws its nodes by itself whenever it resizes.
        canvas.render();
    </script>
</body>
</html>
